<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5ee">
  <title>Butterfly in a Jar | Flexbox + Grid Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #203b35;
      --muted: #62756c;
      --leaf: #39765e;
      --line: #d7dfd2;
      --paper: #f2f5ee;
      --white: #fffefa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(135deg, transparent 24px, rgba(91, 128, 99, 0.045) 25px, transparent 26px) 0 0 / 48px 48px,
        var(--paper);
      font-family: "DM Sans", sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "identity"
        "puzzle";
      gap: 30px;
      width: min(100% - 48px, 1040px);
      margin: 0 auto;
      padding: 48px 0 40px;
    }

    .identity {
      grid-area: identity;
    }

    .course-label {
      margin: 0;
      color: var(--leaf);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 500;
      line-height: 0.98;
    }

    .puzzle-section {
      grid-area: puzzle;
      display: grid;
      justify-items: center;
      padding-top: 4px;
    }

    .puzzle-frame {
      width: min(100%, 600px);
      padding: 10px;
      border: 1px solid rgba(32, 59, 53, 0.13);
      background: var(--white);
      box-shadow: 0 18px 48px rgba(32, 59, 53, 0.12);
    }

    .puzzle {
      display: flex;
      flex-flow: row wrap;
      width: 100%;
      overflow: hidden;
      background: #e6ecdf;
    }

    .piece {
      display: block;
      flex: 0 0 25%;
      width: 25%;
      aspect-ratio: 15 / 11;
      object-fit: cover;
    }

    .decoy {
      display: none;
    }

    .order-1 { order: 1; }
    .order-2 { order: 2; }
    .order-3 { order: 3; }
    .order-4 { order: 4; }
    .order-5 { order: 5; }
    .order-6 { order: 6; }
    .order-7 { order: 7; }
    .order-8 { order: 8; }
    .order-9 { order: 9; }
    .order-10 { order: 10; }
    .order-11 { order: 11; }
    .order-12 { order: 12; }
    .order-13 { order: 13; }
    .order-14 { order: 14; }
    .order-15 { order: 15; }
    .order-16 { order: 16; }

    .puzzle-caption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      width: min(100%, 600px);
      padding: 12px 2px 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .puzzle-caption strong {
      color: var(--ink);
      font-weight: 600;
    }

    @media (max-width: 620px) {
      .page {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "identity"
          "puzzle";
        gap: 22px;
        width: min(100% - 32px, 480px);
        padding: 32px 0 28px;
      }

      .puzzle-frame {
        padding: 6px;
      }

      .puzzle-caption {
        font-size: 0.74rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="identity">
      <p class="course-label">Flexbox + CSS Grid Puzzle</p>
      <h1>Butterfly<br>in a Jar</h1>
    </header>

    <section class="puzzle-section" aria-label="Completed butterfly picture puzzle">
      <div class="puzzle-frame">
        <div class="puzzle">
          <img class="piece order-3" src="images/puzzle1/puzzle1_A.jpg" alt="Puzzle piece 3 of 16">
          <img class="piece order-7" src="images/puzzle1/puzzle1_B.jpg" alt="Puzzle piece 7 of 16">
          <img class="piece order-12" src="images/puzzle1/puzzle1_C.jpg" alt="Puzzle piece 12 of 16">
          <img class="piece decoy" src="images/puzzle1/puzzle1_D.jpg" alt="">
          <img class="piece order-10" src="images/puzzle1/puzzle1_E.jpg" alt="Puzzle piece 10 of 16">
          <img class="piece order-14" src="images/puzzle1/puzzle1_F.jpg" alt="Puzzle piece 14 of 16">
          <img class="piece order-2" src="images/puzzle1/puzzle1_G.jpg" alt="Puzzle piece 2 of 16">
          <img class="piece order-8" src="images/puzzle1/puzzle1_H.jpg" alt="Puzzle piece 8 of 16">
          <img class="piece order-13" src="images/puzzle1/puzzle1_I.jpg" alt="Puzzle piece 13 of 16">
          <img class="piece order-4" src="images/puzzle1/puzzle1_J.jpg" alt="Puzzle piece 4 of 16">
          <img class="piece order-16" src="images/puzzle1/puzzle1_K.jpg" alt="Puzzle piece 16 of 16">
          <img class="piece order-15" src="images/puzzle1/puzzle1_L.jpg" alt="Puzzle piece 15 of 16">
          <img class="piece order-5" src="images/puzzle1/puzzle1_M.jpg" alt="Puzzle piece 5 of 16">
          <img class="piece order-11" src="images/puzzle1/puzzle1_N.jpg" alt="Puzzle piece 11 of 16">
          <img class="piece order-9" src="images/puzzle1/puzzle1_O.jpg" alt="Puzzle piece 9 of 16">
          <img class="piece order-6" src="images/puzzle1/puzzle1_P.jpg" alt="Puzzle piece 6 of 16">
          <img class="piece order-1" src="images/puzzle1/puzzle1_Q.jpg" alt="Puzzle piece 1 of 16">
        </div>
      </div>
      <div class="puzzle-caption">
        <strong>Butterfly in a Jar</strong>
        <span>16 picture pieces</span>
      </div>
    </section>
  </main>
</body>
</html>
